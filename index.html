<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Isobara</title>
  <meta name="description" content="Il meteo di sette modelli, corretto con gli errori dell'ultimo mese nel tuo luogo, con la spiegazione di Claude.">
  <meta name="theme-color" content="#0b1020" id="themeColor">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/urbanist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="veil" aria-hidden="true"></div>

  <div class="app">
    <header class="top">
      <button class="place" id="placeBtn" type="button" aria-haspopup="dialog">
        <span id="placeName">Isobara</span><span class="chev" data-icon="chevron"></span>
      </button>
      <button class="round" id="refreshBtn" type="button" aria-label="Aggiorna la previsione" hidden><span data-icon="refresh"></span></button>
    </header>
    <p class="notice" id="notice" role="status" hidden></p>
    <main id="main"></main>
  </div>

  <button class="ask" id="askBtn" type="button" aria-haspopup="dialog" hidden><span data-icon="sparkle"></span>Chiedi a Claude</button>

  <dialog class="sheet" id="sheet-places" aria-labelledby="t-places"></dialog>
  <dialog class="sheet" id="sheet-claude" aria-labelledby="t-claude"></dialog>
  <dialog class="sheet" id="sheet-trust" aria-labelledby="t-trust"></dialog>

  <noscript><p style="padding:20px;color:#fff">Per usare Isobara serve JavaScript attivo.</p></noscript>
</body>
</html>
